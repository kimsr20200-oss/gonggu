<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공구/전기/건전지 분석 대시보드</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f0fdfa;font-family:'Noto Sans KR',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
.lock{background:#ffffff;border:1px solid #ccfbf1;border-radius:16px;padding:48px 40px;width:380px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.lock-ico{font-size:48px;margin-bottom:16px}
.lock h2{color:#1e293b;font-size:18px;margin-bottom:8px}
.lock p{color:#64748b;font-size:12px;margin-bottom:28px}
.lock input{width:100%;padding:12px 16px;background:#f0fdfa;border:1px solid #ccfbf1;border-radius:8px;color:#1e293b;font-size:14px;outline:none;transition:border .2s}
.lock input:focus{border-color:#0d9488}
.lock input::placeholder{color:#94a3b8}
.lock button{width:100%;padding:12px;margin-top:14px;background:#0d9488;border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:background .15s}
.lock button:hover{background:#0f766e}
.lock .err{color:#ef4444;font-size:11px;margin-top:10px;display:none}
</style>
</head>
<body>
<div class="lock" id="loginBox">
  <div class="lock-ico">🔒</div>
  <h2>공구/전기/건전지 분석 대시보드</h2>
  <p>접근 권한이 필요합니다</p>
  <input type="password" id="pw" placeholder="비밀번호를 입력하세요" autofocus
    onkeydown="if(event.key==='Enter')tryLogin()">
  <button onclick="tryLogin()">접속</button>
  <div class="err" id="err">비밀번호가 올바르지 않습니다</div>
</div>

async function sha256(m){const b=new TextEncoder().encode(m);const h=await crypto.subtle.digest("SHA-256",b);return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,"0")).join("")}
function decompress(b64){
  const bin=atob(b64);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  const ds=new DecompressionStream("gzip");
  const writer=ds.writable.getWriter();
  writer.write(bytes);writer.close();
  return new Response(ds.readable).text();
}
async function tryLogin(){
  const pw=document.getElementById("pw").value;
  const h=await sha256(pw);
  if(h===H){
    sessionStorage.setItem("auth2","1");
    const html=await decompress(D);
    document.open();document.write(html);document.close();
  }else{
    document.getElementById("err").style.display="block";
    document.getElementById("pw").value="";
    document.getElementById("pw").focus();
  }
}
if(sessionStorage.getItem("auth2")==="1"){
  document.addEventListener("DOMContentLoaded",async()=>{
    const html=await decompress(D);
    document.open();document.write(html);document.close();
  });
}
