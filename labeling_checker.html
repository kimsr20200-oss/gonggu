<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>구강용품 표기기준 확인</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:#f8fafc;color:#1e293b;min-height:100vh}

.header{background:#fff;border-bottom:1px solid #e2e8f0;padding:15px 28px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.header h1{font-size:17px;font-weight:700;color:#0f172a}
.badge{background:#dbeafe;color:#1d4ed8;font-size:11px;padding:2px 10px;border-radius:99px;font-weight:700}

.container{max-width:820px;margin:0 auto;padding:28px 20px;display:flex;flex-direction:column;gap:22px}

/* 제품 선택 탭 */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{padding:10px 22px;border-radius:10px;border:2px solid #e2e8f0;background:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;color:#64748b}
.tab:hover{border-color:#93c5fd;color:#2563eb}
.tab.active{border-color:#2563eb;background:#2563eb;color:#fff}

/* 카드 */
.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:24px}
.card-title{font-size:15px;font-weight:700;color:#0f172a;margin-bottom:18px;display:flex;align-items:center;gap:8px}
.step-dot{background:#2563eb;color:#fff;font-size:11px;font-weight:700;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}

/* 규정 목록 */
.rules-list{display:flex;flex-direction:column;gap:6px}
.rule-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:8px;background:#f8fafc;border:1px solid #f1f5f9}
.rule-num{font-size:11px;font-weight:700;color:#fff;background:#64748b;min-width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.rule-item.required .rule-num{background:#2563eb}
.rule-body{flex:1}
.rule-name{font-size:13px;font-weight:700;color:#1e293b}
.rule-note{font-size:11px;color:#64748b;margin-top:3px;line-height:1.5}
.rule-badge{font-size:10px;font-weight:700;padding:1px 7px;border-radius:99px;margin-left:6px}
.req{background:#dbeafe;color:#1d4ed8}
.opt{background:#f1f5f9;color:#94a3b8}

.source-tag{font-size:11px;color:#94a3b8;font-weight:400;margin-left:auto}

/* 업로드 존 */
.upload-zone{border:2px dashed #cbd5e1;border-radius:10px;padding:28px 20px;text-align:center;cursor:pointer;transition:.2s}
.upload-zone:hover,.upload-zone.drag-over{border-color:#3b82f6;background:#eff6ff}
.upload-zone .ico{font-size:32px;margin-bottom:8px}
.upload-zone .lbl{font-size:13px;color:#64748b;font-weight:600}
.upload-zone .sub{font-size:11px;color:#94a3b8;margin-top:4px}
.pkg-preview{width:100%;max-height:280px;object-fit:contain;border:1px solid #e2e8f0;border-radius:10px;margin-top:12px;display:none}

/* 프롬프트 영역 */
.prompt-section{margin-top:18px;display:none}
.section-label{font-size:12px;font-weight:700;color:#475569;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
.prompt-box{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:8px;padding:14px;font-size:12px;line-height:1.7;color:#334155;max-height:180px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
.attach-notice{background:#fefce8;border:1px solid #fde68a;border-radius:8px;padding:10px 14px;font-size:12px;color:#713f12;margin-top:8px;line-height:1.5}

.divider{border:none;border-top:1px solid #f1f5f9;margin:18px 0}

/* 붙여넣기 */
.paste-box{width:100%;border:1px solid #e2e8f0;border-radius:8px;padding:12px;font-size:12px;line-height:1.7;color:#334155;resize:vertical;min-height:110px;font-family:inherit;outline:none;transition:.15s}
.paste-box:focus{border-color:#3b82f6}
.paste-box::placeholder{color:#cbd5e1}

/* 결과 */
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.rbox{border-radius:10px;padding:16px}
.rbox.miss{background:#fef2f2;border:1px solid #fecaca}
.rbox.wrong{background:#fff7ed;border:1px solid #fed7aa}
.rbox.amb{background:#fefce8;border:1px solid #fde68a}
.rbox.ok{background:#f0fdf4;border:1px solid #bbf7d0}
.rbox-title{font-size:13px;font-weight:700;margin-bottom:8px}
.rbox.miss .rbox-title{color:#dc2626}
.rbox.wrong .rbox-title{color:#ea580c}
.rbox.amb .rbox-title{color:#ca8a04}
.rbox.ok .rbox-title{color:#16a34a}
.rbox-body{font-size:12px;line-height:1.7;white-space:pre-wrap}
.rbox.miss .rbox-body{color:#7f1d1d}
.rbox.wrong .rbox-body{color:#7c2d12}
.rbox.amb .rbox-body{color:#713f12}
.rbox.ok .rbox-body{color:#14532d}

/* 버튼 */
.btn{padding:9px 18px;border-radius:8px;border:none;font-size:13px;font-weight:700;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn-blue{background:#2563eb;color:#fff}.btn-blue:hover{background:#1d4ed8}.btn-blue:disabled{background:#93c5fd;cursor:not-allowed}
.btn-green{background:#16a34a;color:#fff}.btn-green:hover{background:#15803d}.btn-green:disabled{background:#86efac;cursor:not-allowed}
.btn-violet{background:#7c3aed;color:#fff}.btn-violet:hover{background:#6d28d9}
.btn-ghost{background:#fff;color:#64748b;border:1px solid #e2e8f0}.btn-ghost:hover{background:#f8fafc}
.btn-sm{padding:5px 12px;font-size:12px}
.btn-copy{background:#fff;border:1px solid #bfdbfe;color:#2563eb;padding:4px 10px;font-size:11px;font-weight:700;border-radius:6px;cursor:pointer}.btn-copy:hover{background:#eff6ff}

.row{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}

.toast{position:fixed;bottom:24px;right:24px;background:#0f172a;color:#fff;padding:11px 20px;border-radius:8px;font-size:13px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:999}
.toast.show{opacity:1}

@media(max-width:600px){.result-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="header">
  <span style="font-size:22px">🦷</span>
  <h1>구강용품 표기기준 확인</h1>
  <span class="badge">식약처 고시 내장</span>
</div>

<div class="toast" id="toast"></div>

<div class="container">

  <!-- ① 제품 선택 -->
  <div>
    <div style="font-size:12px;font-weight:700;color:#64748b;margin-bottom:10px">검사할 제품 선택</div>
    <div class="tabs" id="tabs">
      <button class="tab active" onclick="selectProduct('칫솔')">🪥 칫솔 · 치간칫솔</button>
      <button class="tab" onclick="selectProduct('치실')">🧵 치실</button>
      <button class="tab" onclick="selectProduct('설태제거기')">👅 설태제거기</button>
    </div>
  </div>

  <!-- ② 필수 표기 항목 (규정 내장) -->
  <div class="card">
    <div class="card-title">
      <span class="step-dot">1</span>
      <span id="ruleTitle">칫솔 · 치간칫솔 필수 표기 항목</span>
      <span class="source-tag" id="ruleSource">식약처장관고시 제2025-34호</span>
    </div>
    <div class="rules-list" id="rulesList"></div>
  </div>

  <!-- ③ 패키지 검사 -->
  <div class="card">
    <div class="card-title">
      <span class="step-dot">2</span>패키지 표기 검사
    </div>

    <div class="upload-zone" id="pkgZone"
      onclick="document.getElementById('pkgFile').click()"
      ondragover="onDragOver(event)" ondragleave="onDragLeave()" ondrop="onDrop(event)">
      <div class="ico">📦</div>
      <div class="lbl">패키지 이미지 업로드</div>
      <div class="sub">PNG · JPG · WEBP · 클릭 또는 드래그</div>
    </div>
    <input type="file" id="pkgFile" accept="image/*" style="display:none" onchange="setPkg(this.files[0]);this.value=''">
    <img id="pkgPreview" class="pkg-preview" alt="패키지 미리보기">

    <div class="row">
      <button class="btn btn-blue" id="genBtn" onclick="genPrompt()" disabled>① 프롬프트 생성</button>
      <button class="btn btn-ghost btn-sm" onclick="clearPkg()">초기화</button>
    </div>

    <!-- 생성된 프롬프트 -->
    <div class="prompt-section" id="promptSection">
      <hr class="divider">
      <div class="section-label">
        <span>📝 Claude.ai에 붙여넣을 프롬프트</span>
        <button class="btn-copy" onclick="copyPrompt()">복사</button>
      </div>
      <div class="prompt-box" id="promptBox"></div>
      <div class="attach-notice" id="attachNotice"></div>
      <div class="row">
        <button class="btn btn-violet" onclick="window.open('https://claude.ai','_blank')">② Claude.ai 열기 →</button>
        <span style="font-size:12px;color:#94a3b8">이미지 첨부 후 프롬프트 붙여넣기 → 전송</span>
      </div>

      <hr class="divider">
      <div class="section-label">③ Claude 답변을 여기에 붙여넣기</div>
      <textarea class="paste-box" id="pasteBox" placeholder="Claude.ai의 답변을 복사해서 붙여넣으세요..."></textarea>
      <div class="row">
        <button class="btn btn-green" onclick="parseResult()">결과 분석하기</button>
      </div>
    </div>
  </div>

  <!-- ④ 결과 -->
  <div class="card" id="resultCard" style="display:none">
    <div class="card-title" style="justify-content:space-between">
      <span style="display:flex;align-items:center;gap:8px"><span class="step-dot">3</span>검사 결과</span>
      <button class="btn btn-ghost btn-sm" onclick="copyResult()">결과 복사</button>
    </div>
    <div class="result-grid" id="resultGrid"></div>
  </div>

</div>

<script>
// ════════════════════════════════════════════════════════
//  내장 규정 데이터
// ════════════════════════════════════════════════════════
const RULES = {
  칫솔: {
    title: '칫솔 · 치간칫솔 필수 표기 항목',
    source: '식약처장관고시 제2025-34호',
    items: [
      { n:1,  name:'제품명',                        req:true,  note:'' },
      { n:2,  name:'내용량',                        req:true,  note:'칫솔모·치간칫솔은 개수(개)로 표기' },
      { n:3,  name:'제조업자 및 수입업자의 상호와 주소', req:true,  note:'' },
      { n:4,  name:'제조연월',                      req:true,  note:'' },
      { n:5,  name:'사용방법',                      req:false, note:'필요한 경우에 한함' },
      { n:6,  name:'재질',                          req:true,  note:'부위별 각각 구분 표시 — 칫솔모 / 칫솔대 / 손잡이\n예) 칫솔모=올리부틸렌테레프탈레이트, 칫솔대=폴리프로필렌, 손잡이=폴리프로필렌+고무재' },
    ]
  },
  치실: {
    title: '치실 필수 표기 항목',
    source: '식약처 고시',
    items: [
      { n:1,  name:'"위생용품" 글자',                req:true,  note:'포장에 "위생용품" 문구 반드시 표시' },
      { n:2,  name:'제품명',                        req:true,  note:'' },
      { n:3,  name:'영업소의 명칭 및 소재지',          req:true,  note:'' },
      { n:4,  name:'내용량',                        req:true,  note:'' },
      { n:5,  name:'제조연월일',                    req:true,  note:'' },
      { n:6,  name:'재질명 및 성분명',               req:true,  note:'일반형: 재질·성분 구분 표시\n손잡이 고정형: 실과 손잡이에 사용된 재질 각각 구분, 실에 사용된 성분도 구분 표시' },
      { n:7,  name:'위생용품의 유형',                req:true,  note:'일반용 치실 또는 어린이용 치실' },
      { n:8,  name:'사용 및 보관상 주의사항',          req:true,  note:'어린이용: "어린이가 사용할 때에는 보호자의 도움이 필요합니다" 문구 필수' },
      { n:9,  name:'사용방법',                      req:false, note:'해당하는 경우에 한함' },
      { n:10, name:'적용대상',                      req:true,  note:'어린이용 치실은 사용연령(또는 권장사용연령)을 "0~00세" 범위로 표시' },
    ]
  },
  설태제거기: {
    title: '설태제거기 필수 표기 항목',
    source: '식약처 고시',
    items: [
      { n:1,  name:'"위생용품" 글자',                req:true,  note:'포장에 "위생용품" 문구 반드시 표시' },
      { n:2,  name:'제품명',                        req:true,  note:'' },
      { n:3,  name:'영업소의 명칭 및 소재지',          req:true,  note:'' },
      { n:4,  name:'내용량',                        req:true,  note:'' },
      { n:5,  name:'제조연월일',                    req:true,  note:'' },
      { n:6,  name:'재질명',                        req:true,  note:'혀와 닿는 부위와 손잡이에 사용된 재질을 각각 구분하여 표시' },
      { n:7,  name:'위생용품의 유형',                req:true,  note:'일반용 설태제거기 또는 어린이용 설태제거기' },
      { n:8,  name:'사용 및 보관상 주의사항',          req:true,  note:'어린이용: "어린이가 사용할 때에는 보호자의 도움이 필요합니다" 문구 필수' },
      { n:9,  name:'사용방법',                      req:false, note:'해당하는 경우에 한함' },
      { n:10, name:'적용대상',                      req:true,  note:'어린이용 설태제거기는 사용연령(또는 권장사용연령)을 "0~00세" 범위로 표시' },
    ]
  }
};

// ════════════════════════════════════════════════════════
//  상태
// ════════════════════════════════════════════════════════
let currentProduct = '칫솔';
let pkgImage = null;
let lastResult = '';

// ════════════════════════════════════════════════════════
//  초기화
// ════════════════════════════════════════════════════════
window.onload = () => { renderRules(); };

// ════════════════════════════════════════════════════════
//  제품 선택
// ════════════════════════════════════════════════════════
function selectProduct(key) {
  currentProduct = key;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  renderRules();
  // 프롬프트 초기화
  document.getElementById('promptSection').style.display = 'none';
  document.getElementById('pasteBox').value = '';
  document.getElementById('resultCard').style.display = 'none';
}

function renderRules() {
  const r = RULES[currentProduct];
  document.getElementById('ruleTitle').textContent = r.title;
  document.getElementById('ruleSource').textContent = r.source;
  document.getElementById('rulesList').innerHTML = r.items.map(item => `
    <div class="rule-item ${item.req ? 'required' : ''}">
      <div class="rule-num">${item.n}</div>
      <div class="rule-body">
        <div class="rule-name">
          ${esc(item.name)}
          <span class="rule-badge ${item.req ? 'req' : 'opt'}">${item.req ? '필수' : '조건부'}</span>
        </div>
        ${item.note ? `<div class="rule-note">${esc(item.note).replace(/\n/g,'<br>')}</div>` : ''}
      </div>
    </div>`).join('');
}

// ════════════════════════════════════════════════════════
//  패키지 이미지
// ════════════════════════════════════════════════════════
function onDragOver(e) { e.preventDefault(); document.getElementById('pkgZone').classList.add('drag-over'); }
function onDragLeave()  { document.getElementById('pkgZone').classList.remove('drag-over'); }
function onDrop(e)      { e.preventDefault(); onDragLeave(); const f=[...e.dataTransfer.files].find(f=>f.type.startsWith('image/')); if(f) setPkg(f); }

function setPkg(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = e => {
    pkgImage = { url: e.target.result, name: file.name };
    const prev = document.getElementById('pkgPreview');
    prev.src = pkgImage.url; prev.style.display = 'block';
    document.getElementById('pkgZone').style.display = 'none';
    document.getElementById('genBtn').disabled = false;
  };
  reader.readAsDataURL(file);
}

function clearPkg() {
  pkgImage = null;
  document.getElementById('pkgPreview').style.display = 'none';
  document.getElementById('pkgZone').style.display = 'block';
  document.getElementById('genBtn').disabled = true;
  document.getElementById('promptSection').style.display = 'none';
  document.getElementById('pasteBox').value = '';
  document.getElementById('resultCard').style.display = 'none';
}

// ════════════════════════════════════════════════════════
//  프롬프트 생성
// ════════════════════════════════════════════════════════
function buildRulesText() {
  const r = RULES[currentProduct];
  return r.items.map(item => {
    const badge = item.req ? '[필수]' : '[조건부]';
    const note  = item.note ? `\n     → ${item.note}` : '';
    return `  ${item.n}. ${item.name} ${badge}${note}`;
  }).join('\n');
}

function genPrompt() {
  if (!pkgImage) { toast('패키지 이미지를 먼저 올려주세요'); return; }
  const r = RULES[currentProduct];

  const prompt =
`아래는 식약처 고시 기준에 따른 ${r.title}입니다:

${buildRulesText()}

─────────────────────────────
첨부한 패키지 이미지를 위 기준과 비교하여 검사해주세요.

결과는 반드시 아래 4개 섹션 형식으로 작성해주세요:

## ❌ 누락된 항목
기준에서 필수지만 패키지에서 확인되지 않는 항목. 없으면 "해당 없음" 기재.

## ⚠️ 잘못된 표기
있긴 하지만 기준에 맞지 않거나 오류가 있는 항목. 없으면 "해당 없음" 기재.

## 🤔 애매한 항목
표기가 있으나 이미지 품질이나 내용이 불명확하여 추가 확인이 필요한 항목. 없으면 "해당 없음" 기재.

## ✅ 정상 표기
기준에 맞게 올바르게 표기된 항목.

각 항목에 대해 간결하고 구체적으로 설명해주세요.`;

  document.getElementById('promptBox').textContent = prompt;
  document.getElementById('attachNotice').innerHTML =
    `<strong>📎 첨부할 이미지:</strong> ${esc(pkgImage.name)}<br>이미지를 Claude.ai에 첨부하고 위 프롬프트를 붙여넣은 후 전송하세요.`;
  document.getElementById('promptSection').style.display = 'block';
  document.getElementById('promptSection').scrollIntoView({ behavior:'smooth', block:'start' });
  toast('프롬프트 생성 완료!');
}

function copyPrompt() {
  navigator.clipboard.writeText(document.getElementById('promptBox').textContent)
    .then(() => toast('프롬프트 복사됨!'));
}

// ════════════════════════════════════════════════════════
//  결과 파싱
// ════════════════════════════════════════════════════════
function parseResult() {
  const text = document.getElementById('pasteBox').value.trim();
  if (!text) { toast('Claude 답변을 붙여넣어 주세요'); return; }
  lastResult = text;

  const sections = [
    { cls:'miss',  title:'❌ 누락된 항목',  key:'누락된 항목' },
    { cls:'wrong', title:'⚠️ 잘못된 표기', key:'잘못된 표기' },
    { cls:'amb',   title:'🤔 애매한 항목',  key:'애매한 항목' },
    { cls:'ok',    title:'✅ 정상 표기',   key:'정상 표기' },
  ];

  document.getElementById('resultGrid').innerHTML = sections.map(s => {
    const body = extractSection(text, s.key) || '정보 없음';
    return `<div class="rbox ${s.cls}">
      <div class="rbox-title">${s.title}</div>
      <div class="rbox-body">${esc(body)}</div>
    </div>`;
  }).join('');

  document.getElementById('resultCard').style.display = 'block';
  document.getElementById('resultCard').scrollIntoView({ behavior:'smooth', block:'start' });
  toast('결과 분석 완료!');
}

function extractSection(text, heading) {
  const re = new RegExp(`##[^\\n]*${heading}[^\\n]*\\n([\\s\\S]*?)(?=\\n##|$)`, 'i');
  const m = text.match(re);
  return m ? m[1].trim() : null;
}

function copyResult() {
  if (!lastResult) return;
  navigator.clipboard.writeText(lastResult).then(() => toast('결과 복사됨!'));
}

// ════════════════════════════════════════════════════════
//  유틸
// ════════════════════════════════════════════════════════
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

let _tt;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_tt); _tt = setTimeout(() => el.classList.remove('show'), 3000);
}
</script>
</body>
</html>
